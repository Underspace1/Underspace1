name: Update profile streak

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-streak.yml'

permissions:
  contents: write

concurrency:
  group: profile-streak
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate card from public GitHub contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import urllib.request
          
          today = dt.datetime.now(dt.timezone.utc).date()
          start = today - dt.timedelta(days=364)
          if os.environ.get("PROFILE_SNAPSHOT"):
              snapshot = json.loads(os.environ["PROFILE_SNAPSHOT"])
              today = dt.date.fromisoformat(snapshot["today"])
              start = today - dt.timedelta(days=364)
              counts = {d["date"]: d["count"] for d in snapshot["positive"]}
          else:
              query = """query($login:String!,$from:DateTime!,$to:DateTime!){
                user(login:$login){contributionsCollection(from:$from,to:$to){
                  contributionCalendar{weeks{contributionDays{date contributionCount}}}
                }}
              }"""
              variables = {"login": os.environ["GITHUB_REPOSITORY_OWNER"],
                           "from": start.isoformat() + "T00:00:00Z",
                           "to": dt.datetime.now(dt.timezone.utc).isoformat()}
              request = urllib.request.Request("https://api.github.com/graphql",
                  data=json.dumps({"query": query, "variables": variables}).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Content-Type": "application/json", "User-Agent": "profile-streak"})
              with urllib.request.urlopen(request, timeout=40) as response:
                  data = json.load(response)
              if data.get("errors"):
                  raise RuntimeError("GitHub contributions query failed: " + json.dumps(data["errors"]))
              weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
              counts = {day["date"]: day["contributionCount"] for week in weeks for day in week["contributionDays"]}
              if today.isoformat() not in counts:
                  raise RuntimeError("Contribution calendar does not include today")
          
          days = [(start + dt.timedelta(days=i)).isoformat() for i in range(365)]
          total = sum(counts.get(day, 0) for day in days)
          best = run = 0
          for day in days:
              run = run + 1 if counts.get(day, 0) else 0
              best = max(best, run)
          cursor = today if counts.get(today.isoformat(), 0) else today - dt.timedelta(days=1)
          current = 0
          while cursor >= start and counts.get(cursor.isoformat(), 0):
              current += 1
              cursor -= dt.timedelta(days=1)
          
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="250" viewBox="0 0 1040 250" role="img" aria-labelledby="title desc">
          <title id="title">Underspace1 GitHub streak</title>
          <desc id="desc">{total} contributions in the last 365 days; current streak {current} days; longest streak in this window {best} days. Updated {today} UTC.</desc>
          <rect x="1" y="1" width="1038" height="248" rx="18" fill="#10110e" stroke="#393d2d" stroke-width="2"/>
          <g font-family="DejaVu Sans,Arial,sans-serif">
          <text x="35" y="38" font-size="15" fill="#f4f3e8" letter-spacing="2">03 / CONSISTENCY</text>
          <text x="1004" y="38" text-anchor="end" font-size="12" fill="#b0b1a5">GITHUB DATA / 365 DAYS</text>
          <path d="M350 65V192M690 65V192" stroke="#393d2d"/>
          <g fill="#d6ff5f" font-size="76" font-weight="800" text-anchor="middle">
          <text x="178" y="141">{total}</text><text x="520" y="141">{current}</text><text x="862" y="141">{best}</text>
          </g>
          <g fill="#f4f3e8" font-size="14" text-anchor="middle" letter-spacing="1">
          <text x="178" y="177">CONTRIBUTIONS</text><text x="520" y="177">CURRENT STREAK / DAYS</text><text x="862" y="177">BEST IN WINDOW / DAYS</text>
          </g>
          <path d="M35 207H1004" stroke="#393d2d"/>
          <g fill="#b0b1a5" font-size="12">
          <text x="35" y="232">{start} — {today} / UTC</text><text x="1004" y="232" text-anchor="end">UPDATED {today} / DAILY</text>
          </g></g></svg>
          '''
          Path("assets").mkdir(exist_ok=True)
          Path("assets/streak.svg").write_text(svg, encoding="utf-8")
          print(f"Contributions: {total}; current: {current}; best: {best}; updated: {today}")
          PY
      - name: Publish updated card
        run: |
          if git diff --quiet -- assets/streak.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/streak.svg
          git commit -m "Update profile streak card"
          git push
