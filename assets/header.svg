<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
  <title id="t">Mikael Roca · Underspace</title>
  <desc id="d">Étudiant en 1re année à Epitech Paris. Apprend le C, à l'aise avec l'IA. Un terminal affiche : whoami, école, compilation en cours.</desc>
  <style>
    .d{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .m{font-family:'Cascadia Code',Consolas,'DejaVu Sans Mono',Menlo,monospace}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.cur{animation:none}}
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e2c799" opacity=".09"/></pattern>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%"><stop offset="0" stop-color="#e2c799" stop-opacity=".10"/><stop offset="1" stop-color="#e2c799" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1000" height="320" rx="20" fill="#0b0b0a"/>
  <rect width="1000" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1000" height="320" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="999" height="319" rx="19.5" fill="none" stroke="#2a2824"/>

  <!-- identité -->
  <text class="m" x="48" y="72" font-size="13" fill="#e2c799" letter-spacing="3">UNDERSPACE · PARIS</text>
  <text class="d" x="45" y="142" font-size="64" font-weight="800" fill="#f3ede2" letter-spacing="-1.5">Mikael <tspan fill="#e2c799">Roca</tspan></text>
  <text class="d" x="48" y="180" font-size="20" fill="#cfc6b6">Étudiant en 1re année à Epitech Paris</text>

  <g class="m" font-size="13">
    <rect x="48" y="210" width="150" height="30" rx="15" fill="#151412" stroke="#e2c799"/>
    <text x="123" y="230" text-anchor="middle" fill="#e2c799">Apprend le C</text>
    <rect x="208" y="210" width="170" height="30" rx="15" fill="#151412" stroke="#34312a"/>
    <text x="293" y="230" text-anchor="middle" fill="#f3ede2">IA · Claude Code</text>
    <rect x="388" y="210" width="180" height="30" rx="15" fill="#151412" stroke="#34312a"/>
    <text x="478" y="230" text-anchor="middle" fill="#f3ede2">Rust · JS · Python</text>
  </g>
  <text class="m" x="48" y="282" font-size="12" fill="#948b7c">vyfz.online  ·  github.com/Underspace1</text>

  <!-- terminal -->
  <g>
    <rect x="600" y="48" width="352" height="224" rx="12" fill="#121211" stroke="#2a2824"/>
    <path d="M600 60a12 12 0 0 1 12-12h328a12 12 0 0 1 12 12v18H600z" fill="#191816"/>
    <circle cx="620" cy="63" r="5" fill="#3a3730"/><circle cx="638" cy="63" r="5" fill="#3a3730"/><circle cx="656" cy="63" r="5" fill="#e2c799" opacity=".7"/>
    <text class="m" x="776" y="67" font-size="11" fill="#948b7c" text-anchor="middle">~/underspace</text>
    <g class="m" font-size="13">
      <text class="ty" style="animation-delay:.2s" x="620" y="108"><tspan fill="#e2c799">$</tspan><tspan fill="#f3ede2"> whoami</tspan></text>
      <text class="ty" style="animation-delay:.6s" x="620" y="130" fill="#cfc6b6">mikael · underspace</text>
      <text class="ty" style="animation-delay:1.1s" x="620" y="162"><tspan fill="#e2c799">$</tspan><tspan fill="#f3ede2"> cat ecole.txt</tspan></text>
      <text class="ty" style="animation-delay:1.5s" x="620" y="184" fill="#cfc6b6">Epitech Paris · 1re année</text>
      <text class="ty" style="animation-delay:2s" x="620" y="216"><tspan fill="#e2c799">$</tspan><tspan fill="#f3ede2"> gcc main.c -o apprendre</tspan></text>
      <text class="ty" style="animation-delay:2.5s" x="620" y="238" fill="#cfc6b6">compilation en cours</text>
      <rect class="cur" x="784" y="227" width="8" height="15" fill="#e2c799"/>
    </g>
  </g>
</svg>
