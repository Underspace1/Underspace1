<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
  <title id="t">Ce que je sais faire</title>
  <desc id="d">IA : développement assisté par IA avec Claude Code, plusieurs modèles, prompt engineering, intégration par API et MCP. Code : bases du C en cours à Epitech, notions de JavaScript, Python, Rust, HTML et CSS. Outils : Git, GitHub, Linux, Unix, Docker, Caddy, Cloudflare, VS Code.</desc>
